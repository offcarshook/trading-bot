# Daily multi-strategy PAPER portfolio (config/daily_portfolio.yaml).
# Two UTC triggers cover EST/EDT; the job exits unless the market is open and
# NY time is inside window_start..window_end (09:31-11:00):
#   13:37 UTC = 09:37 EDT (runs) | 08:37 EST (exits)
#   14:37 UTC = 10:37 EDT (exits: already rebalanced today) | 09:37 EST (runs)
# Crypto sleeves (if the config has any) trade from a third trigger at 00:07
# UTC every day, right after Alpaca's daily crypto bar closes. Each run only
# touches its own asset class.
name: daily portfolio (paper)

on:
  schedule:
    - cron: "37 13 * * 1-5"
    - cron: "37 14 * * 1-5"
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute targets and orders, send nothing"
        type: boolean
        default: true
      force:
        description: "Rebalance even if already done today / outside the window"
        type: boolean
        default: false
      asset_class:
        description: "stocks | crypto | all"
        default: "stocks"

concurrency:
  group: ictbot-daily-portfolio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Rebalance
        env:
          SCHEDULE: ${{ github.event.schedule }}
          ASSET_CLASS: ${{ inputs.asset_class }}
        run: |
          ARGS="--asset-class stocks"
          [ "$SCHEDULE" = "7 0 * * *" ] && ARGS="--asset-class crypto"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$ASSET_CLASS" in stocks|crypto|all) ARGS="--asset-class $ASSET_CLASS" ;; *) echo "bad asset_class"; exit 1 ;; esac
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force --ignore-window"
          fi
          python -m ictbot rebalance $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-portfolio-${{ github.run_id }}
          path: |
            logs/
            reports/
          if-no-files-found: ignore
          retention-days: 90
