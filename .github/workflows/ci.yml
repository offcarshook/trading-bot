name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Config validates
        run: python -c "from ictbot.config import load_config; from ictbot.risk import validate_risk_config; validate_risk_config(load_config('config.yaml'))"
      - run: python -m pytest -q
